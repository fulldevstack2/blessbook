<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blesspoke has moved to Blessbook</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://fulldevstack2.github.io/blessbook/" />
    <meta http-equiv="refresh" content="0; url=https://fulldevstack2.github.io/blessbook/" />
    <script>
      (function () {
        var base = "https://fulldevstack2.github.io/blessbook";
        var rest = location.pathname.replace(/^\/blesspoke\/?/, "/");
        if (rest === "/") rest = "";
        location.replace(base + rest + location.search + location.hash);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #17110a;
        color: #f5efe6;
      }
      a {
        color: #c9a962;
      }
    </style>
  </head>
  <body>
    <p>Blesspoke has moved to <a href="https://fulldevstack2.github.io/blessbook/">Blessbook</a>.</p>
  </body>
</html>
