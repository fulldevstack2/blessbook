<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Blesspoke · Commission a song from Dennis Lau</title>
    <meta
      name="description"
      content="Malaysia's foremost electric violinist writes and produces one original song for you. A sample inside seven days, and the finished song is yours outright."
    />
    <meta name="author" content="Dennis Lau" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- The mark is three feathers off one shoulder: his six-string violin, the
         Phoenix, is carved as a bird's wing. SVG first for anything modern, the
         two PNGs for browsers that still want a raster, and the touch icon
         bleeds to its own edges because the OS rounds that one itself. -->
    <link rel="icon" href="%VITE_BASE%icon.svg" type="image/svg+xml" />
    <link rel="icon" href="%VITE_BASE%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%VITE_BASE%favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="%VITE_BASE%apple-touch-icon.png" />
    <link rel="manifest" href="%VITE_BASE%site.webmanifest" />

    <!-- The origin comes from VITE_SITE_URL at build time; see .env. Link
         scrapers do not reliably resolve a relative image, so this must be an
         absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blesspoke" />
    <meta property="og:locale" content="en_MY" />
    <meta property="og:title" content="Dennis Lau · Commission a song of your own" />
    <meta
      property="og:description"
      content="Dennis Lau is Malaysia's foremost electric violinist and the first performer anywhere to take a six-string 24K gold violin onto a stage. Commission an original song, written and produced by him."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Phoenix, Dennis Lau's six-string 24K gold violin carved as a bird's wing, lit against black beside his name."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dennis Lau · Commission a song of your own" />
    <meta
      name="twitter:description"
      content="Malaysia's foremost electric violinist writes and produces one original song for you. A sample inside seven days, and the finished song is yours outright."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta
      name="twitter:image:alt"
      content="The Phoenix, Dennis Lau's six-string 24K gold violin carved as a bird's wing, lit against black beside his name."
    />

    <!-- Structured data. The Person's own `url` points at his site rather than
         this one on purpose: this page is Blesspoke, the commission service he
         provides, and saying otherwise would claim to be his homepage. `sameAs`
         is what ties the entity together for a search engine. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "%VITE_SITE_URL%/#dennis",
            "name": "Dennis Lau",
            "alternateName": "刘凯彦",
            "url": "https://dennislau.thechosen.io",
            "image": "%VITE_SITE_URL%/og.jpg",
            "jobTitle": "Electric violinist, composer and producer",
            "description": "Malaysia's foremost electric violinist. Classically trained from the age of three, and the first performer anywhere to take a six-string 24K gold violin onto a stage.",
            "birthPlace": { "@type": "Place", "name": "Perak, Malaysia" },
            "nationality": { "@type": "Country", "name": "Malaysia" },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Kuala Lumpur",
              "addressCountry": "MY"
            },
            "knowsAbout": ["Violin", "Composition", "Music production"],
            "award": [
              "Malaysian Book of Records, for the gold six-string Phoenix violin",
              "VIMA Music Awards, Best Producer, 2009",
              "Trinity College London, Award for Outstanding Performance"
            ],
            "sameAs": [
              "https://dennislau.thechosen.io",
              "https://instagram.com/dennisviolin",
              "https://www.youtube.com/@DennisLauTV",
              "https://facebook.com/MosaicMusicEntertainment",
              "https://x.com/dennislauviolin"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#site",
            "name": "Blesspoke",
            "url": "%VITE_SITE_URL%/",
            "inLanguage": "en",
            "description": "Commission an original song, written and produced by Dennis Lau.",
            "about": { "@id": "%VITE_SITE_URL%/#dennis" }
          },
          {
            "@type": "Service",
            "@id": "%VITE_SITE_URL%/#commission",
            "name": "Blesspoke commission",
            "serviceType": "Bespoke music composition and production",
            "description": "One original song, written and produced for a single client. A private sample inside seven days, two rounds of changes, and full transfer of the composition copyright and master recording on delivery.",
            "provider": { "@id": "%VITE_SITE_URL%/#dennis" },
            "areaServed": "Worldwide",
            "offers": [
              {
                "@type": "Offer",
                "name": "Full original song",
                "description": "Three to four minutes, with lyrics if required.",
                "price": "2500",
                "priceCurrency": "USD",
                "availability": "https://schema.org/InStock"
              },
              {
                "@type": "Offer",
                "name": "Original music track",
                "description": "Up to ninety seconds, for a campaign, a brand film, an opening or a launch.",
                "price": "1500",
                "priceCurrency": "USD",
                "availability": "https://schema.org/InStock"
              }
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#17110a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
