<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Blesspoke · Create your own song</title>
    <meta
      name="description"
      content="One prompt. One request. One song, written and produced for you by Dennis Lau, guaranteed in seven days or less, and the ownership is yours."
    />
    <link rel="icon" href="%VITE_BASE%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%VITE_BASE%icon.svg" />

    <!-- The origin comes from VITE_SITE_URL at build time; see .env. Link
         scrapers do not reliably resolve a relative image, so once the
         publishing account is settled this must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blesspoke" />
    <meta property="og:title" content="Blesspoke · Create your own song" />
    <meta
      property="og:description"
      content="One prompt. One request. One song, written and produced for you by Dennis Lau, guaranteed in seven days or less, and the ownership is yours."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Create your own song. One prompt, one request, and the song is yours."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blesspoke · Create your own song" />
    <meta
      name="twitter:description"
      content="One song, written and produced for you by Dennis Lau. Guaranteed in seven days or less."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#241a10" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
